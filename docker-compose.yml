version: "3.8"

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: quotepilot-db
    environment:
      POSTGRES_USER: quotepilot
      POSTGRES_PASSWORD: quotepilot123
      POSTGRES_DB: quotepilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/init-db.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata:
